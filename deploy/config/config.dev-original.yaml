# Dev profile WITH the Original UI switch (make dev-original): the Explore tile and the staff door
# start Brian L. Stuart's Tk front end on this Mac through scripts/dev-original-ui-session.sh,
# which stands in for the kiosk session loop. Otherwise identical to config.dev.yaml.
# Relative paths are resolved against this file's directory.
profile: dev
listen: 127.0.0.1:8740
health: { listen: "127.0.0.1:8741" }
core: { gomaxprocs: 2, nice: 5, readyTimeout: 5s, ackTimeout: 1.5s, silenceTimeout: 2s, probeEvery: 5s }
recovery: { budget: 3, window: 5m, backoff: [2s, 5s, 10s], slowRetry: 10m }
idle: { setupS: 90, runS: 180, countdownS: 15 }
admin: { sessionTimeoutS: 120, allowPowerActions: false, allowUpdates: false }
metrics: { retentionDays: 400 }
assets: { upstreamPhotos: false }
paths:
  release: ../..
  core: ../../build/darwin-arm64/eniac-core
  upstream: ../../build/upstream
  missions: ../../missions
  web: ../../build/web
  webSrc: ../../src/web
  run: ../../build/run
  state: ../../build/state
  uiSwitch: ../../build/ui
  originalUi: ../../build/original-ui

originalUi:
  enabled: true
  tourIdleS: 300
  interactiveIdleS: 900
  warnS: 30
  requestTtlS: 10
  minGapS: 10
  wish: /usr/bin/wish   # only checked to exist; the session script runs KIOSK_WISH (Tk 8.6)
