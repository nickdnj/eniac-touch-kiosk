# Mission 2: Fire Mission. The Army's version of Battleship (ENIAC was paid for by Army Ordnance): the visitor picks a howitzer,
# a charge and an elevation, ENIAC flies the shell for real, and a forward observer radios how far off it landed. A miss earns a
# second round at the same target with the correction in hand: the adjust-fire drill of real artillery. The
# program is Brian Stuart's trajdemo.e with only the launch-speed loads re-pointed to the Constant Transmitter's
# dials (missions/programs/gunnery.e; the bridge sets the dials from the aim).
schema: 1
id: firemission
title: "Fire Mission"
order: 2
summary: "Call in artillery. Two rounds to hit."
minutes: 3
program: gunnery.e
programSha256: "8778acc5cad05c09fa06027deea58b6ab6f65602990fadefc02b4deb92729306"
includes: { drag.e: "66d42fed31297875080da7cf30780fff03d70d43c09aaa4e957adaa02abf194e" }
assets: { demo.card: "86ae09c103ba0af54b982cb5be78fb7707014397067801da3c9c68036bc1b4d8" }   # the file holds the same card twice; the first is read
ordered: true

steps:
  - id: reader-done-to-1-2
    line: "p i.Ro 1-2"
    expect: { from: i.Ro, to: 1-2 }
    text:
      headline: "Tell ENIAC the card was read"
      body: "ENIAC takes in numbers from punched cards. When the reader finishes, it sends a signal. Tap the reader OUT jack on the Initiating Unit. Then tap program trunk 1-2."
      more: "Cards were how numbers got into ENIAC. A card had 80 columns. The card in this mission holds seven numbers of up to 10 digits."
      done: "Now the reader can tell the machine it is done."
      hints:
        wrongFrom: "That jack belongs to another job. We want the reader, OUT."
        wrongTo: "Try program trunk 1-2."
      review: { factCheck: [more], source: "ux-spec 8.3.5 step 1 ([I: 7 numbers, to be confirmed against proccard])" }

  - id: trunk14-to-h
    line: "p 1-4 p.Hi"
    expect: { from: 1-4, to: p.Hi }
    text:
      headline: "Start the next hop"
      body: "The 'keep going' signal must start another hop. The Master Programmer, ENIAC's conductor, runs the hops. Tap program trunk 1-4. Then tap the H jack on the Master Programmer."
      more: "The Master Programmer had ten steppers, each counting stages and handing off to the next, a bit like a music box with pins. This one is the stepper for the hop loop."
      done: "Hop after hop, ENIAC will fly the shell. Your cables made the loop!"
      button: "Finish wiring"
      hints:
        wrongFrom: "Try program trunk 1-4."
        wrongTo: "That jack is for a different stepper. Look for H."
      review: { factCheck: [more], source: "ux-spec 8.3.5 step 5" }

withheld:                        # the file's last three lines are b c, b r, b i
  - { line: "b c", button: read } # sent first: prevents the all-zero first card (spike S2)
  - { line: "b r", button: read }
  - { line: "b i", button: init }

run:
  buttons: [read, init]
  watch: ["15", "18", "20", "6", "4", "1"]   # hop, along, up, along speed, up speed; 1 holds the card's first number
  idle: { quietMs: auto }
  initOnce: true                 # a second INIT mid-flight corrupts the flight (spike S2)
  initAfter: card-read           # INIT only once the card is in (Acc 1 = 97367)
  freezeAt: landed               # s cy.op 1a on the landing card: nothing more is punched
  speeds:
    full: { rate: 0, stallMs: 10000 }   # Full only: a card every 1.43 s on the Mac (spike S2); no card for 10 s while busy = stall
  defaultSpeed: full
  cards:
    window: [21, 80]             # hop 26-30, along 51-60, up 71-80
    value: [5]
    hop: [5]
    style: film
    keep: 20
  plot: { x: [10, 11], y: [14, 15] }

checkpoints:
  - { id: card-read, when: { acc: "1", eq: 97367 } }
  - { id: first-hop, when: { punchCount: { gte: 1 } } }
  - { id: landed,    when: { punchField: { index: 14, startsWith: "-" } } }   # "up" turns negative: card 34
result: landed

content:
  game:
    kind: army
    ships:                       # the visitor's guns; the field is "ships" in the schema (shared with Battleship)
      - { id: light, label: "Light howitzer", guns: [g1, g2] }
      - { id: field, label: "Field howitzer", guns: [g3, g4] }
      - { id: heavy, label: "Heavy howitzer", guns: [g5, g6] }
    charges:                     # the guns; speeds are in the same range measured for Gunnery (docs/gunnery-mission.md)
      - { id: g1, label: "Charge 1", speed: 600 }
      - { id: g2, label: "Charge 2", speed: 750 }
      - { id: g3, label: "Charge 3", speed: 900 }
      - { id: g4, label: "Charge 4", speed: 1050 }
      - { id: g5, label: "Charge 5", speed: 1200 }
      - { id: g6, label: "Charge 6", speed: 1300 }
    elevations:
      - { id: e5, deg: 5 }
      - { id: e10, deg: 10 }
      - { id: e15, deg: 15 }
      - { id: e20, deg: 20 }
    targets:                     # each is the ground crossing of a shot on the grid (docs/gunnery-mission.md), so a perfect round exists; a bigger hull has a bigger hit radius
      - { id: t1, feet: 3700, name: "Enemy machine-gun nest", hit: 150, art: nest }
      - { id: t2, feet: 5400, name: "Enemy supply truck", hit: 150, art: truck }
      - { id: t3, feet: 8200, name: "Enemy bridge", hit: 200, art: bridge }
      - { id: t4, feet: 10950, name: "Enemy bunker", hit: 200, art: bunker }
      - { id: t5, feet: 14000, name: "Enemy tank column", hit: 300, art: tanks }
      - { id: t6, feet: 15550, name: "Enemy ammunition dump", hit: 300, art: depot }
      - { id: t7, feet: 19700, name: "Enemy gun battery", hit: 400, art: battery }
      - { id: t8, feet: 24500, name: "Enemy rail yard", hit: 400, art: railyard }
    table:                       # worked out on the real core through the bridge, 2026-10-22/23, re-measured 2026-10-27 after Stuart's trajdemo.e fix (docs/gunnery-mission.md); seconds are the interpolated landing time
      - { gun: g1, elevation: e5, feet: 1888, secs: 3.2 }
      - { gun: g1, elevation: e10, feet: 3708, secs: 6.4 }
      - { gun: g1, elevation: e15, feet: 5376, secs: 9.5 }
      - { gun: g1, elevation: e20, feet: 6842, secs: 12.6 }
      - { gun: g2, elevation: e5, feet: 2971, secs: 4.0 }
      - { gun: g2, elevation: e10, feet: 5752, secs: 8.0 }
      - { gun: g2, elevation: e15, feet: 8252, secs: 11.9 }
      - { gun: g2, elevation: e20, feet: 10432, secs: 15.6 }
      - { gun: g3, elevation: e5, feet: 4233, secs: 4.8 }
      - { gun: g3, elevation: e10, feet: 8168, secs: 9.6 }
      - { gun: g3, elevation: e15, feet: 11691, secs: 14.2 }
      - { gun: g3, elevation: e20, feet: 14716, secs: 18.7 }
      - { gun: g4, elevation: e5, feet: 5703, secs: 5.6 }
      - { gun: g4, elevation: e10, feet: 10951, secs: 11.1 }
      - { gun: g4, elevation: e15, feet: 15545, secs: 16.5 }
      - { gun: g4, elevation: e20, feet: 19466, secs: 21.6 }
      - { gun: g5, elevation: e5, feet: 7377, secs: 6.4 }
      - { gun: g5, elevation: e10, feet: 13992, secs: 12.6 }
      - { gun: g5, elevation: e15, feet: 19716, secs: 18.7 }
      - { gun: g5, elevation: e20, feet: 24526, secs: 24.4 }
      - { gun: g6, elevation: e5, feet: 8601, secs: 6.9 }
      - { gun: g6, elevation: e10, feet: 16120, secs: 13.6 }
      - { gun: g6, elevation: e15, feet: 22586, secs: 20.1 }
      - { gun: g6, elevation: e20, feet: 27959, secs: 26.2 }
    firing:
      button: "Firing table"
      title: "FIRING TABLE"
      sub: "Worked out on this ENIAC simulator"
      note: "Brian Stuart's recreation of the 1946 shell program. Not a real Army table."
      gun: "{label}  ·  {n} ft/s"
      angle: "Angle"
      range: "Range (ft)"
      time: "Flight (s)"
      target: "Your target: {name}, {feet} ft"
      near: "Nearest: {gun} at {angle} degrees, {miss} ft from the target."
      none: "None of these guns can hit it. Try another gun."
      use: "Use this shot"
      close: "Close"
    score: { max: 1000, hitFeet: 250, zeroFeet: 5000 }
    blurb: "A game: aim and fire"
    tour:                        # the walk through the room after the shot is aimed; from and to are room ids (web/app/explore/room.ts). `text` is one line, `bullets` are the docent's talking points.
      - from: init
        to: init
        title: "Initiating Unit"
        text: "Where a job starts."
        bullets:
          - "Pressing the initiating pulse button sends out the first signal, and the program takes over."
          - "The same unit holds CLEAR, which wipes the numbers back to zero."
          - "It also holds the button that starts the card reader, and hears when the reader is done."
      - from: cyc
        to: cyc
        title: "Cycling Unit"
        text: "ENIAC's heartbeat."
        bullets:
          - "A clock ticking about 100,000 times a second."
          - "Every unit follows this beat, so numbers and signals arrive at exactly the right moment."
          - "One addition takes 20 ticks."
      - from: mp
        to: mp
        title: "Master Programmer"
        text: "ENIAC's conductor."
        bullets:
          - "It counts, and it decides what happens next."
          - "Here it runs 50 tiny steps for every hop, then a card is punched."
          - "Then it asks: is the shell still in the air? If so, another hop."
          - "Ten steppers, a bit like a music box with pins."
      - from: a4
        to: a6
        title: "Accumulators 4 and 6"
        text: "Adding machines that remember."
        bullets:
          - "Each holds one 10-digit number, shown in neon lamps."
          - "ENIAC had no memory bank. Its 20 accumulators were its memory: 20 numbers at once."
          - "An accumulator can pass its number on to another, so a result becomes the next step's input."
          - "Here: up speed in Accumulator 4, along speed in Accumulator 6."
      - from: mult
        to: mult
        title: "High-Speed Multiplier"
        text: "Times tables, fast."
        bullets:
          - "It multiplies two 10-digit numbers in about 3 thousandths of a second."
          - "It does it digit by digit with a built-in one-digit times table, then adds up the partial products."
          - "Here it squares the shell's speed, to look up how much the air slows it."
          - "Far faster than adding again and again."
      - from: ft2
        to: ft2
        title: "Function Table 2"
        text: "A look-up table, set with switches."
        bullets:
          - "Give it a number and it hands back the matching answer, like a dictionary."
          - "Here it is the air-drag table: 100 numbers, one for each speed."
          - "Set by hand with switches, nothing stored electronically."
          - "Brian Stuart worked the drag numbers out himself, so they are his best attempt."
      - from: a15
        to: a20
        title: "Accumulators 15 to 20"
        text: "The flight, in numbers."
        bullets:
          - "Accumulator 15 counts the hops, 18 holds how far along, 20 how high up."
          - "Accumulator 19 asks: is the shell still above ground?"
          - "Each hop's numbers pass along to feed the next hop."
          - "The cards you will see punched are these numbers, one card per hop."
      - from: ct
        to: ct
        title: "Constant Transmitter"
        text: "Numbers in."
        bullets:
          - "Numbers that never change go in here: set on dials, or read from a punched card."
          - "Your charge and your angle are dialled in here as two numbers: how fast along, how fast up."
          - "The IBM card reader sits beside it."
      - from: pr
        to: pr
        title: "Card Reader and Punch"
        text: "Answers out, on cards."
        bullets:
          - "It reads the card of constants first."
          - "Then it punches one card for every hop. Each card is one dot on your arc."
          - "In 1946 numbers went in and out of ENIAC on punched cards, not screens."
    build:
      headline: "ENIAC is loading the gun"
      intro: "Your shot is dialled in. ENIAC has placed {cables} cables and {switches} switches. Here is what it uses."
      count: "{n} of {total}"
      next: "Next"
      back: "Back"
