# tygo: Go protocol types -> TypeScript. Run `make protogen`.
# Generated files live next to their Go source (the web UI imports them from
# there); a Go test fails if they are stale.
packages:
  - path: "eniac-kiosk/bridge/internal/protocol"
    output_path: "internal/protocol/protocol.gen.ts"
    exclude_files: ["decode.go"]
    frontmatter: |
      // GENERATED by tygo from src/bridge/internal/protocol/protocol.go. DO NOT EDIT.
      // Regenerate with `make protogen`.
      export type DeepPartial<T> = { [K in keyof T]?: T[K] extends object ? DeepPartial<T[K]> : T[K] };
      /** A JSON Merge Patch (RFC 7396) against MachineState. */
      export type MachinePatch = DeepPartial<MachineState>;
  - path: "eniac-kiosk/bridge/internal/mission"
    output_path: "internal/mission/mission.gen.ts"
    include_files: ["compile.go", "schema.go"]
    frontmatter: |
      // GENERATED by tygo from src/bridge/internal/mission/{compile,schema}.go. DO NOT EDIT.
      // Types for GET /api/missions (Summary[]) and GET /api/missions/{id} (Compiled).
      // Regenerate with `make protogen`.
