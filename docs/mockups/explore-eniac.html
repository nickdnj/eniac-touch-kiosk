<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Explore ENIAC: mockup (UX spec 14.3)</title>
<!-- Design mockup for docs/ux-spec.md 14.3 (S14 Explore ENIAC) and 15 (Glossary). Standalone: open in Chrome; it scales to the window.
     The panel art is the approved kit (src/web/app/panels/art.ts) embedded once as symbols; the room layout is the 40-panel
     table in ux-spec 14.3 (from upstream vis/eniactk.go). Card and glossary copy is the proposed copy from the spec, with [FC] marks.
     This file was generated once from those sources; edit it by hand from here on.
     Lamps are lit for illustration only. In the kiosk they are live from the core, or dark (no demo fallback).
     Pan arrows, minimap and tap-a-unit are the real interaction; a horizontal swipe on the room is the optional extra (UX-03).
     URL shortcuts (for screenshots): ?unit=acc7  ?unit=mp  ?mission=3  ?x=1500  ?glossary=1 -->
<style>
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 400; src: url("../../src/web/fonts/atkinson-hyperlegible-latin-400-normal.woff2"); }
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 700; src: url("../../src/web/fonts/atkinson-hyperlegible-latin-700-normal.woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("../../src/web/fonts/ibm-plex-mono-latin-500-normal.woff2"); }
:root {
  --bg-stage: #101215; --panel: #1B1D21; --jack-block: #D8CFAE; --card: #F4EFE3; --ink: #1B1D21; --guide: #F0E442;
  --ok: #009E73; --lamp-on: #FFB000; --lamp-off: #3A2E1E; --cable-data: #56B4E9; --cable-prog: #CC79A7; --muted: #9AA0A8;
  --font-ui: "Atkinson Hyperlegible", system-ui, sans-serif; --font-mono: "IBM Plex Mono", ui-monospace, monospace;
}
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
#stage { width: 1920px; height: 1080px; position: absolute; left: 0; top: 0; transform-origin: 0 0; background: var(--bg-stage); color: var(--card);
  font-family: var(--font-ui); font-size: 28px; line-height: 40px; overflow: hidden; }
.lamp .lamp-lit { opacity: 0; }

/* chrome (same as the other screens) */
header { position: absolute; left: 0; top: 0; width: 1920px; height: 96px; display: flex; align-items: center; gap: 24px; padding: 0 24px 0 10px; border-bottom: 1px solid #222; background: #0A0B0D; }
.logo { font-weight: 700; font-size: 28px; letter-spacing: 3px; color: #D8CFAE; width: 110px; }
.btn-o { border: 3px solid var(--card); border-radius: 12px; height: 64px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 28px; padding: 0 28px; white-space: nowrap; }
h1 { font-size: 40px; margin: 0; flex: 1; line-height: 48px; }
footer { position: absolute; left: 0; top: 1032px; width: 1920px; height: 48px; display: flex; align-items: center; padding: 0 32px; font-size: 24px; font-weight: 700; color: #C9C2A8; background: #0A0B0D; border-top: 1px solid #25282d; z-index: 50; }

/* the room (panorama) */
#room { position: absolute; left: 24px; top: 112px; width: 1360px; height: 640px; background: #0b0c0f; border-radius: 8px; overflow: hidden; touch-action: none; }
#strip { position: absolute; left: 0; top: 0; width: 7360px; height: 640px; transition: transform 450ms ease-in-out; }
#strip.drag { transition: none; }
.tray { position: absolute; left: 0; width: 7360px; height: 72px; }
.tray.d { top: 0; } .tray.p { top: 472px; }
.tray .bar { position: absolute; left: 0; right: 0; top: 22px; height: 28px; border-radius: 6px; background: linear-gradient(#A3A8B0, #6B7078 45%, #3A3D43); box-shadow: 0 2px 6px #000; }
.tray .wires { position: absolute; left: 0; right: 0; top: 29px; height: 14px; background:
  repeating-linear-gradient(90deg, transparent 0 10px, rgba(0,0,0,.25) 10px 12px); }
.tray.d .wires { background-color: var(--cable-data); }
.tray.p .wires { background-color: var(--cable-prog); height: 8px; top: 32px; background-image: repeating-linear-gradient(90deg, transparent 0 14px, rgba(0,0,0,.35) 14px 20px); }
.tray .tag { position: absolute; top: 12px; height: 48px; padding: 0 16px; border-radius: 24px; background: #0b0c0f; border: 3px solid var(--card); font-size: 24px; font-weight: 700; line-height: 42px; white-space: nowrap; color: var(--card); }
.tray.sel .bar { outline: 6px solid var(--card); outline-offset: 4px; }
.tray.hl .bar { outline: 6px solid var(--guide); outline-offset: 4px; }
.stub { position: absolute; width: 8px; background: var(--cable-data); border-radius: 4px; top: 46px; height: 28px; }
.stub.pp { background: var(--cable-prog); top: 450px; height: 36px; }
.unit { position: absolute; top: 72px; height: 400px; display: flex; cursor: pointer; }
.unit .pw { display: block; height: 400px; margin-right: 8px; }
.unit .pw:last-of-type { margin-right: 0; }
.unit svg.p { width: 100%; height: 100%; display: block; }
.unit .ring { position: absolute; inset: -8px; border-radius: 10px; display: none; pointer-events: none; }
.unit.hl .ring { display: block; border: 6px solid var(--guide); box-shadow: 0 0 0 2px #000, inset 0 0 0 2px #000; }
.unit.sel .ring { display: block; border: 6px solid var(--card); box-shadow: 0 0 0 2px #000, inset 0 0 0 2px #000, 0 0 24px rgba(244,239,227,.35); }
.unit .badge { display: none; position: absolute; left: -12px; top: -26px; width: 56px; height: 56px; border-radius: 50%; background: #000; border: 3px solid var(--card); color: #fff; font-size: 34px; line-height: 50px; text-align: center; font-weight: 700; pointer-events: none; z-index: 3; }
.unit.hl .badge { display: block; }
.unit.dim { filter: brightness(.36) saturate(.6); }
.chip.dim { opacity: .4; }
.cart { position: absolute; left: 70px; bottom: -2px; width: 220px; height: 132px; z-index: 2; }
.aux { position: absolute; width: 190px; height: 124px; bottom: 0; z-index: 2; pointer-events: none; }
.aux.reader { left: 4px; } .aux.punch { right: 2px; }
.chip { position: absolute; top: 548px; height: 80px; border-radius: 12px; background: var(--card); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 28px; font-size: 24px; font-weight: 700; text-align: center; border: 3px solid transparent; }
.chip strong { font-size: 30px; line-height: 32px; }
.chip.sel { border-color: var(--guide); background: #fff; outline: 4px solid var(--card); outline-offset: 2px; }
.arrow { position: absolute; top: 172px; width: 96px; height: 200px; border-radius: 16px; background: rgba(10,11,13,.88); border: 3px solid var(--card); display: flex; align-items: center; justify-content: center; z-index: 20; }
.arrow.l { left: 12px; } .arrow.r { right: 12px; }
.arrow[disabled] { opacity: .25; cursor: default; }
.arrow svg { width: 48px; height: 72px; }

/* minimap */
#minimap { position: absolute; left: 24px; top: 768px; width: 1360px; height: 96px; border-radius: 8px; background: #0b0c0f; border: 2px solid #2a2e35; }
#cells { position: absolute; left: 20px; top: 20px; width: 1320px; height: 56px; display: flex; }
.mc { flex: 0 0 33px; height: 56px; margin: 0; font-style: normal; font-size: 20px; font-weight: 700; color: #101215; display: flex; align-items: center; justify-content: center; border-right: 1px solid #0b0c0f; position: relative; }
.mc em { position: absolute; left: 0; right: 0; top: -17px; height: 14px; display: none; font-style: normal; text-align: center; }
.mk-init, .mk-cyc, .mk-mp { background: #E6DEC1; } .mk-acc { background: var(--lamp-on); } .mk-mult, .mk-div { background: #CC79A7; }
.mk-ft { background: #56B4E9; } .mk-ct, .mk-pr { background: #009E73; color: #fff; }
.mc.hl { outline: 4px solid var(--guide); outline-offset: -4px; z-index: 2; }
.mc.dim { opacity: .3; }
#vb { position: absolute; top: 12px; height: 72px; border: 5px solid var(--card); border-radius: 6px; box-shadow: 0 0 0 2px #000, inset 0 0 0 2px #000; pointer-events: none; transition: left 450ms ease-in-out; }
#walls { position: absolute; left: 24px; top: 868px; width: 1360px; height: 36px; }
.wall { position: absolute; top: 0; height: 36px; border-top: 4px solid #5b606a; border-left: 4px solid #5b606a; border-right: 4px solid #5b606a; text-align: center; font-size: 24px; line-height: 40px; color: #C9C2A8; }
#readout { position: absolute; left: 24px; top: 906px; width: 1360px; height: 40px; font-size: 24px; line-height: 40px; color: #C9C2A8; }
#readout b { color: var(--card); }
#mchips { position: absolute; left: 24px; top: 952px; width: 1360px; height: 64px; display: flex; align-items: center; gap: 16px; font-size: 24px; font-weight: 700; color: #C9C2A8; }
.mchip { height: 64px; border: 3px solid var(--card); border-radius: 12px; display: flex; align-items: center; gap: 12px; padding: 0 20px 0 10px; font-size: 26px; font-weight: 700; color: var(--card); }
.mchip i { font-style: normal; width: 40px; height: 40px; border-radius: 50%; background: #000; border: 3px solid var(--card); color: #fff; text-align: center; line-height: 34px; font-size: 26px; }
.mchip.on { background: var(--guide); color: #000; border-color: #000; }
.mchip.on i { border-color: #000; }

/* rail */
#rail { position: absolute; left: 1408px; top: 112px; width: 488px; height: 904px; background: var(--card); color: var(--ink); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; }
#rail .eyebrow { font-size: 24px; line-height: 32px; font-weight: 700; color: #4a4d52; letter-spacing: .5px; display: flex; align-items: center; justify-content: space-between; min-height: 64px; }
#rail h2 { font-size: 40px; line-height: 46px; margin: 4px 0 12px; }
#rail p { font-size: 28px; line-height: 40px; margin: 0; }
.close { width: 64px; height: 64px; border: 3px solid var(--ink); border-radius: 12px; font-size: 32px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.banner { height: 112px; border-radius: 10px; overflow: hidden; background: #101215; margin: 4px 0 12px; position: relative; }
.banner svg { position: absolute; left: 0; top: 0; width: 100%; }
.used { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
.used > span { font-size: 24px; font-weight: 700; color: #4a4d52; }
.used .row { display: flex; gap: 8px; flex-wrap: wrap; }
.used .mchip { color: var(--ink); border-color: var(--ink); padding: 0 12px 0 6px; font-size: 24px; height: 64px; }
.used .mchip i { background: #000; width: 38px; height: 38px; line-height: 32px; }
.used .mchip.on { background: var(--guide); }
.link { min-height: 56px; font-size: 28px; font-weight: 700; text-decoration: underline; text-align: left; color: var(--ink); margin: 8px 0 0; display: block; }
.nav { display: flex; gap: 16px; margin-top: 12px; }
.btn-p { flex: 1; height: 96px; border-radius: 12px; background: var(--ink); color: var(--card); font-size: 32px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.btn-s { flex: 1; height: 96px; border-radius: 12px; border: 3px solid var(--ink); font-size: 32px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.btn-s[disabled] { opacity: .3; }
#plan { margin: 12px 0; }

/* glossary overlay */
#gloss { position: absolute; left: 0; top: 96px; width: 1920px; height: 936px; background: var(--bg-stage); z-index: 30; display: none; padding: 16px 48px; }
#gloss.on { display: block; }
#gloss .gh { display: flex; align-items: center; gap: 24px; height: 80px; }
#gloss .gh h2 { margin: 0; font-size: 48px; flex: 1; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 8px; }
.tile { background: var(--card); color: var(--ink); border-radius: 16px; padding: 14px 24px; height: 184px; position: relative; }
.tile b { font-size: 30px; line-height: 36px; display: block; }
.tile span { font-size: 26px; line-height: 34px; display: block; }
.tile.hold { background: #E9C9B8; }
.tile .show { position: absolute; right: 16px; bottom: 10px; font-size: 24px; font-weight: 700; text-decoration: underline; }
#toast { position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%); background: #000; border: 3px solid var(--guide); border-radius: 32px; padding: 8px 28px; font-size: 26px; z-index: 60; display: none; }
.note { position: absolute; right: 12px; top: 1040px; z-index: 70; background: #F0E442; color: #000; font: 700 16px/32px system-ui; padding: 0 12px; border-radius: 6px; white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { #strip, #vb { transition: none; } }
</style>
</head>

ton class="chip" data-id="a12" style="left:3868px;width:176px"><span>Accumulator</span><strong>12</strong></button><button class="chip" data-id="a13" style="left:4052px;width:176px"><span>Accumulator</span><strong>13</strong></button><button class="chip" data-id="a14" style="left:4236px;width:176px"><span>Accumulator</span><strong>14</strong></button><button class="chip" data-id="a15" style="left:4420px;width:176px"><span>Accumulator</span><strong>15</strong></button><button class="chip" data-id="a16" style="left:4604px;width:176px"><span>Accumulator</span><strong>16</strong></button><button class="chip" data-id="a17" style="left:4788px;width:176px"><span>Accumulator</span><strong>17</strong></button><button class="chip" data-id="a18" style="left:4972px;width:176px"><span>Accumulator</span><strong>18</strong></button><button class="chip" data-id="ft2" style="left:5156px;width:360px"><span>Function Table</span><strong>2</strong></button><button class="chip" data-id="ft3" style="left:5524px;width:360px"><span>Function Table</span><strong>3</strong></button><button class="chip" data-id="a19" style="left:5892px;width:176px"><span>Accumulator</span><strong>19</strong></button><button class="chip" data-id="a20" style="left:6076px;width:176px"><span>Accumulator</span><strong>20</strong></button><button class="chip" data-id="ct" style="left:6260px;width:360px"><span>Constant Transmitter</span></button><button class="chip" data-id="pr" style="left:6628px;width:728px"><span>Printer</span></button>

<script>
const D = {"ROOM":[{"id":"init","kind":"init","at":0,"n":1,"l1":"Initiating","l2":"Unit"},{"id":"cyc","kind":"cyc","at":1,"n":1,"l1":"Cycling","l2":"Unit"},{"id":"mp","kind":"mp","at":2,"n":2,"l1":"Master Programmer","l2":""},{"id":"ft1","kind":"ft","at":4,"n":2,"l1":"Function Table","l2":"1","ft":1},{"id":"a1","kind":"acc","at":6,"n":1,"acc":1},{"id":"a2","kind":"acc","at":7,"n":1,"acc":2},{"id":"div","kind":"div","at":8,"n":1,"l1":"Divider and","l2":"Square-Rooter"},{"id":"a3","kind":"acc","at":9,"n":1,"acc":3},{"id":"a4","kind":"acc","at":10,"n":1,"acc":4},{"id":"a5","kind":"acc","at":11,"n":1,"acc":5},{"id":"a6","kind":"acc","at":12,"n":1,"acc":6},{"id":"a7","kind":"acc","at":13,"n":1,"acc":7},{"id":"a8","kind":"acc","at":14,"n":1,"acc":8},{"id":"a9","kind":"acc","at":15,"n":1,"acc":9},{"id":"a10","kind":"acc","at":16,"n":1,"acc":10},{"id":"mult","kind":"mult","at":17,"n":3,"l1":"High-Speed Multiplier","l2":""},{"id":"a11","kind":"acc","at":20,"n":1,"acc":11},{"id":"a12","kind":"acc","at":21,"n":1,"acc":12},{"id":"a13","kind":"acc","at":22,"n":1,"acc":13},{"id":"a14","kind":"acc","at":23,"n":1,"acc":14},{"id":"a15","kind":"acc","at":24,"n":1,"acc":15},{"id":"a16","kind":"acc","at":25,"n":1,"acc":16},{"id":"a17","kind":"acc","at":26,"n":1,"acc":17},{"id":"a18","kind":"acc","at":27,"n":1,"acc":18},{"id":"ft2","kind":"ft","at":28,"n":2,"l1":"Function Table","l2":"2","ft":2},{"id":"ft3","kind":"ft","at":30,"n":2,"l1":"Function Table","l2":"3","ft":3},{"id":"a19","kind":"acc","at":32,"n":1,"acc":19},{"id":"a20","kind":"acc","at":33,"n":1,"acc":20},{"id":"ct","kind":"ct","at":34,"n":2,"l1":"Constant Transmitter","l2":""},{"id":"pr","kind":"pr","at":36,"n":4,"l1":"Printer","l2":""}],"CARDS":{"room":{"title":"ENIAC filled a room.","tag":"","body":"Forty panels stood in a U shape, about 80 feet end to end [FC]. Each panel had one job, and cables joined them. Tap any panel to meet it, or press Walk the room."},"init":{"title":"Initiating Unit","tag":"The GO button","body":"This unit has ENIAC's GO button, called INIT. Press it and a first signal shoots out and starts the job. It also holds CLEAR, and the button that starts the card reader."},"cyc":{"title":"Cycling Unit","tag":"The heartbeat","body":"ENIAC's clock. It ticks about 100,000 times a second [FC]. Every unit follows this beat, so numbers and signals arrive at exactly the right moment. One addition takes 20 ticks [FC]."},"mp":{"title":"Master Programmer","tag":"The conductor","body":"The conductor. It counts, and decides what happens next, like \"do this ten times, then do that.\" It has ten steppers [FC], a bit like a music box with pins."},"acc":{"title":"Accumulator","tag":"Adds and remembers","body":"An accumulator adds numbers and remembers them. Each holds one 10-digit number, shown in neon lamps [FC]. ENIAC had 20, so it could keep 20 numbers at once."},"mult":{"title":"High-Speed Multiplier","tag":"Times tables, fast","body":"It knows the times table [FC]. It multiplies two 10-digit numbers in about 3 thousandths of a second [FC]. Adding again and again would be far slower. The shell mission uses it on every hop."},"div":{"title":"Divider and Square-Rooter","tag":"Divides, and finds roots","body":"One unit, two jobs: it divides one number by another, and it finds square roots [FC]. It is slower than the multiplier [FC]. None of our missions need it, but it is still here."},"ft":{"title":"Function Table","tag":"A look-up table","body":"A function table is a look-up table. Give it a number and it hands back the matching answer, like a dictionary. ENIAC had three [FC], each with 104 rows [FC], set with switches."},"pft":{"title":"Portable Function Table","tag":"Switches on wheels","body":"The switches sit on a wheeled cart called a portable table [FC]. People set them by hand, one number at a time. The shell mission's air-drag table takes 711 switches."},"ct":{"title":"Constant Transmitter","tag":"Numbers in","body":"This is how numbers get into ENIAC. Dials hold numbers that never change. The IBM card reader beside it feeds in new ones from punched cards [FC]. Mission 3 reads a card here."},"pr":{"title":"Printer","tag":"Answers out","body":"ENIAC's answers come out here as punched cards, made by an IBM card punch [FC]. Each card holds the numbers ENIAC was told to print. Missions 2 and 3 watch the cards pile up."},"dt":{"title":"Digit Trays","tag":"Number highways","body":"Long trays of cables carry numbers between units, like a highway. A number travels on a bundle of wires, one wire for each place: ones, tens, hundreds [FC]. Also called data trunks."},"pt":{"title":"Program Trays","tag":"\"Go!\" signals","body":"These trays carry signals, not numbers. A program pulse is one \"go!\" on one wire [FC]. It tells a unit to start its next job. Change the cables and you change the program."}},"STOPS":["init","cyc","mp","acc","mult","div","ft","pft","ct","pr","dt","pt"],"USED_IN":{"init":[1,2,3],"cyc":[],"mp":[2,3],"acc":[1,2,3],"mult":[3],"div":[],"ft":[2,3],"pft":[3],"ct":[1,2,3],"pr":[2,3],"dt":[1,2,3],"pt":[1,2,3]},"MISSIONS":{"1":{"name":"Squares","units":["init","ct","a1","a2"]},"2":{"name":"Primes","units":["init","ct","mp","ft1","pr","a1","a2","a3","a4","a5","a6","a7","a8","a9","a10","a11","a12","a13","a14","a19"]},"3":{"name":"Trajectory","units":["init","ct","mp","mult","ft2","pr","a1","a2","a4","a5","a6","a7","a8","a9","a10","a11","a12","a13","a14","a15","a16","a17","a18","a19","a20"]}},"GLOSSARY":[["Accumulator","ENIAC's adding machine and memory. Each holds one 10-digit number and shows it in neon lamps. ENIAC had 20. [FC]","acc"],["Digit tray (data trunk)","A tray of cables that carries numbers between units. Our missions call it a data trunk, a highway for numbers. [FC]","dt"],["Program tray (program trunk)","A tray of cables that carries \"go!\" signals, not numbers. Our missions call them program trunks, like 1-1 and 1-3. [FC]","pt"],["Program pulse","One \"go!\" signal on one wire. It tells a unit to start a job. When the job ends, the unit sends its own pulse. [FC]","pt"],["Program control","The small circuit that waits for a program pulse, does its job once or several times, then sends \"done\" on its output. [FC]","acc"],["INIT (initiating pulse)","The GO signal. Pressing INIT on the Initiating Unit sends it out on a program tray to start the whole job. [FC]","init"],["Clock tick (add time)","ENIAC's beat, from the Cycling Unit: about 100,000 a second. One addition takes 20 ticks, about 1/5,000 of a second. [FC]","cyc"],["Stepper","A part of the Master Programmer that counts through stages, one at a time. It hands the work from one job to the next. [FC]","mp"],["Constant","A number that does not change while a program runs. It is set on dials in the Constant Transmitter. [FC]","ct"],["Function table","A look-up table of 104 numbers, set with switches. Give it a number and it hands back the matching answer. [FC]","ft"],["Punched card","A stiff paper card with holes. The holes are digits. ENIAC reads cards in, and punches its answers onto cards. [FC]","pr"],["Jack and cable","A jack is a socket. A plug on a cable goes into it. Plugging cables in is how ENIAC was programmed. [FC]","pt"],["Receive and send jacks","An accumulator takes numbers in on alpha to epsilon. It sends its number out on A, or on S, which sends it as a subtraction. [FC]","acc"],["Operation and repeat switches","Each program has two switches: what to do (take in on alpha, send on A) and how many times to do it. [FC]","acc"],["Neon lamp","A small glowing bulb. Each accumulator shows its number with lamps: one lit lamp for each digit. [FC]","acc"],["Transceiver","HOLD: do not show until confirmed. Draft: a part that sends numbers onto a tray, or receives them from it. [FC]",null]],"PITCH":184};
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const PITCH = D.PITCH, VW = 1360, STRIP = 40 * PITCH, STEP = 6 * PITCH, MAXX = STRIP - VW;
const unitById = Object.fromEntries(D.ROOM.map((u) => [u.id, u]));
const name = (u) => u.kind === "acc" ? `Accumulator ${u.acc}` : [u.l1, u.l2].filter(Boolean).join(" ").replace("Initiating Unit", "Initiating Unit");
const cardOf = (u) => u.kind;
const state = { x: 0, sel: null, mission: 0, allAcc: false, gloss: 0, glossPage: 0 };
const q = new URLSearchParams(location.search);

// strip furniture: tray labels, stubs
(function furniture() {
  const s = $("#strip");
  for (let x = 120; x < STRIP; x += 1500) {
    const d = document.createElement("span"); d.className = "tag"; d.style.left = x + "px"; d.style.top = "12px"; d.textContent = "DIGIT TRAYS: numbers travel here"; $(".tray.d", s).append(d);
    const p = document.createElement("span"); p.className = "tag"; p.style.left = (x + 600) + "px"; p.style.top = "12px"; p.textContent = "PROGRAM TRAYS: \"go!\" signals"; $(".tray.p", s).append(p);
  }
  for (const u of D.ROOM) {
    const cx = u.at * PITCH + (u.n * PITCH) / 2;
    const a = document.createElement("i"); a.className = "stub"; a.style.left = cx - 4 + "px"; s.append(a);
    const b = document.createElement("i"); b.className = "stub pp"; b.style.left = cx - 4 + "px"; s.append(b);
  }
})();

function usedBy(id, m) { return D.MISSIONS[m].units.includes(id); }
function clampX(x) { return Math.max(0, Math.min(MAXX, x)); }
function centreOn(panelStart, n) { return clampX((panelStart + n / 2) * PITCH - VW / 2); }
function visibleRange() { return [Math.max(0, Math.floor(state.x / PITCH)), Math.min(39, Math.floor((state.x + VW - 1) / PITCH))]; }
const unitAt = (p) => D.ROOM.find((u) => p >= u.at && p < u.at + u.n);

function stopOf(id) { // which stop a unit id belongs to
  if (id === "dt" || id === "pt" || id === "pft") return id;
  const u = unitById[id]; return u ? (u.kind === "ft" ? "ft" : u.kind) : null;
}
function panelFor(stop) {
  const first = { init: "init", cyc: "cyc", mp: "mp", acc: "a1", mult: "mult", div: "div", ft: "ft2", pft: "ft2", ct: "ct", pr: "pr" }[stop];
  if (!first) return stop === "dt" || stop === "pt" ? Math.round(state.x / PITCH + 3.5) : 0;
  const u = unitById[first]; return centreOn(u.at, u.n);
}

function render() {
  $("#strip").style.transform = `translateX(${-state.x}px)`;
  $("#al").disabled = state.x <= 0; $("#ar").disabled = state.x >= MAXX;
  const [a, b] = visibleRange();
  $("#vb").style.left = 20 + (state.x / PITCH) * 33 + "px"; $("#vb").style.width = (VW / PITCH) * 33 + "px";
  const ua = unitAt(a), ub = unitAt(b);
  $("#readout").innerHTML = `You are looking at: <b>${name(ua)}</b> to <b>${name(ub)}</b>`;
  const m = state.mission;
  const selStop = state.sel;
  $$(".unit").forEach((el) => {
    const u = unitById[el.dataset.id];
    const hl = (m && usedBy(u.id, m)) || (state.allAcc && u.kind === "acc");
    el.classList.toggle("hl", !!hl);
    el.classList.toggle("dim", !!m && !hl);
    const sel = selStop && (stopOf(u.id) === selStop) && !(selStop === "acc" && state.selId && state.selId !== u.id) && !(selStop === "pft");
    el.classList.toggle("sel", !!sel && !hl);
    el.querySelector(".badge").textContent = m || "";
  });
  $$(".chip").forEach((el) => {
    const u = unitById[el.dataset.id];
    el.classList.toggle("dim", !!m && !usedBy(u.id, m));
    el.classList.toggle("sel", !!selStop && stopOf(u.id) === selStop && !(selStop === "acc" && state.selId && state.selId !== u.id) && selStop !== "pft");
  });
  $(".tray.d").classList.toggle("sel", selStop === "dt"); $(".tray.p").classList.toggle("sel", selStop === "pt");
  $(".tray.d").classList.toggle("hl", !!m); $(".tray.p").classList.toggle("hl", !!m);
  // minimap
  $$(".mc").forEach((el) => {
    const i = +el.dataset.i, u = unitAt(i);
    el.classList.toggle("hl", !!m && usedBy(u.id, m));
    el.classList.toggle("dim", !!m && !usedBy(u.id, m));
  });
  // mission chips row
  $("#mchips").innerHTML = `<span>Show the units for:</span>` + [1, 2, 3].map((n) => `<button class="mchip ${m === n ? "on" : ""}" data-m="${n}"><i>${n}</i>${D.MISSIONS[n].name}</button>`).join("") + (m ? `<button class="mchip" data-m="0">Clear</button>` : "");
  $$("#mchips .mchip").forEach((el) => el.onclick = () => { setMission(+el.dataset.m); });
  rail();
}

function planSvg() {
  // plan view of the U from above: left wall bottom->top, back wall left->right, right wall top->bottom (as roomplan.ts)
  const K = 11, W0 = 60; let s = "";
  const rect = (n) => n < 16 ? { x: 6, y: W0 + (15 - n) * K, w: 36, h: K - 1.5 } : n < 24 ? { x: 46 + (n - 16) * 30.5, y: 8, w: 29, h: 40 } : { x: 296, y: W0 + (n - 24) * K, w: 36, h: K - 1.5 };
  const [a, b] = visibleRange();
  for (let n = 0; n < 40; n++) {
    const r = rect(n), k = $('.mc[data-i="' + n + '"]').className.match(/mk-(\w+)/)[1];
    const col = { init: "#E6DEC1", cyc: "#E6DEC1", mp: "#E6DEC1", acc: "#FFB000", mult: "#CC79A7", div: "#CC79A7", ft: "#56B4E9", ct: "#009E73", pr: "#009E73" }[k];
    const on = n >= a && n <= b;
    s += '<rect x="' + r.x + '" y="' + r.y + '" width="' + r.w + '" height="' + r.h + '" fill="' + col + '" opacity="' + (on ? 1 : 0.4) + '" ' + (on ? 'stroke="#000" stroke-width="3"' : "") + '/>';
  }
  return '<svg id="plan" viewBox="0 0 344 240" width="100%" height="240" role="img" aria-label="The room seen from above">' + s + '</svg><div style="font-size:24px;line-height:32px;color:#4a4d52">The room from above. Bold outlines show what is on screen.</div>';
}

function banner(stop, selId) {
  const sym = { init: ["s-init", 100], cyc: ["s-cyc", 100], mp: ["s-mp", 100], acc: ["s-acc", 100], mult: ["s-mult0", 100], div: ["s-div", 100], ft: ["s-ft2", 100], pft: ["s-ftB", 100], ct: ["s-ct", 100], pr: ["s-pr", 100] }[stop];
  if (stop === "dt" || stop === "pt") {
    const c = stop === "dt" ? "#56B4E9" : "#CC79A7";
    return `<div class="banner" style="height:72px"><svg viewBox="0 0 456 128" preserveAspectRatio="xMidYMid slice"><rect x="0" y="40" width="456" height="40" fill="url(#g-rail)"/><rect x="0" y="52" width="456" height="${stop === "dt" ? 16 : 9}" y2="" fill="${c}"/>${Array.from({ length: 14 }, (_, i) => `<rect x="${i * 34}" y="${stop === "dt" ? 52 : 56}" width="${stop === "dt" ? 4 : 6}" height="${stop === "dt" ? 16 : 9}" fill="rgba(0,0,0,.3)"/>`).join("")}</svg></div>`;
  }
  return `<div class="banner"><svg viewBox="0 0 300 80" preserveAspectRatio="xMidYMin slice"><use href="#${sym[0]}" width="300" height="680"/></svg></div>`;
}

function rail() {
  const r = $("#rail"), m = state.mission;
  if (!state.sel) {
    if (m) {
      const list = { 1: "Squares uses 4 units: the Initiating Unit, the Constant Transmitter, and Accumulators 1 and 2. You plug cables between them.",
        2: "Primes uses the Initiating Unit, the Constant Transmitter, the Master Programmer, Function Table 1, the Printer, and 15 accumulators: 1 to 14, and 19.",
        3: "The shell uses the Initiating Unit, Constant Transmitter, Master Programmer, High-Speed Multiplier, Function Table 2, the Printer, and 19 accumulators: 1, 2, and 4 to 20." }[m];
      r.innerHTML = `<div class="eyebrow"><span>MISSION ${m}</span></div><h2>${D.MISSIONS[m].name}</h2><p>${list}</p><p style="margin-top:16px;font-weight:700">The yellow rings show where they stand.</p>${planSvg()}<div style="margin-top:auto"><button class="btn-p" id="startm" style="width:100%">Start Mission ${m} ›</button></div>`;
      $("#startm").onclick = () => toast(`Kiosk: starts Mission ${m} (fresh core, S0 then S3)`);
      return;
    }
    r.innerHTML = `<div class="eyebrow"><span>THE WHOLE MACHINE</span></div><h2>${D.CARDS.room.title}</h2><p>${D.CARDS.room.body.replace(" [FC]", "<sup style='font-size:14px'>FC</sup>")}</p>${planSvg()}<div style="margin-top:auto"><button class="btn-p" id="walk" style="width:100%">Walk the room ›</button></div>`;
    $("#walk").onclick = () => select("init");
    return;
  }
  const stop = state.sel, c = D.CARDS[stop], i = D.STOPS.indexOf(stop);
  let title = c.title, tag = c.tag;
  if (stop === "acc" && state.selId) { title = name(unitById[state.selId]); tag = "One of 20"; }
  if (stop === "ft" && state.selId) { title = name(unitById[state.selId]); }
  const used = D.USED_IN[stop];
  const usedHtml = used.length ? `<div class="used"><span>USED IN</span><div class="row">${used.map((n) => `<button class="mchip ${m === n ? "on" : ""}" data-m="${n}"><i>${n}</i>${D.MISSIONS[n].name}</button>`).join("")}</div></div>` : `<div class="used"><span>USED IN</span><span style="font-weight:400;font-size:24px;color:#4a4d52">${stop === "cyc" ? "Every mission, but you never plug it in." : "None of our missions."}</span></div>`;
  const extra = stop === "acc" ? `<button class="link" id="x1">${state.allAcc ? "Hide the 20" : "Light up all 20 accumulators"}</button>`
    : stop === "pt" ? `<button class="link" id="x2">Meet the first programmers ›</button>`
    : stop === "ct" || stop === "pr" ? "" : "";
  r.innerHTML = `<div class="eyebrow"><span>${i + 1} OF ${D.STOPS.length} · ${tag.toUpperCase()}</span><button class="close" id="cl" aria-label="Close">✕</button></div>${banner(stop)}<h2>${title}</h2><p>${c.body.replace(/ ?\[FC\]/g, "<sup style='font-size:14px;color:#8a4b00'> FC</sup>")}</p>${extra}${usedHtml}<div class="nav"><button class="btn-s" id="pv" ${i === 0 ? "disabled" : ""}>‹ Previous</button><button class="btn-p" id="nx">${i === D.STOPS.length - 1 ? "Finish" : "Next ›"}</button></div>`;
  $("#cl").onclick = () => select(null);
  $("#pv").onclick = () => select(D.STOPS[i - 1]);
  $("#nx").onclick = () => select(i === D.STOPS.length - 1 ? null : D.STOPS[i + 1]);
  if ($("#x1")) $("#x1").onclick = () => { state.allAcc = !state.allAcc; render(); };
  if ($("#x2")) $("#x2").onclick = () => toast("Kiosk: opens the honor roll, page 2: The first programmers (S11b)");
  $$("#rail .used .mchip").forEach((el) => el.onclick = () => setMission(+el.dataset.m));
}

function select(stop, id) {
  state.sel = stop; state.selId = id || null;
  if (stop) {
    if (stop === "acc" && id) state.x = centreOn(unitById[id].at, 1);
    else if (stop === "ft" && id) state.x = centreOn(unitById[id].at, 2);
    else state.x = panelFor(stop);
  }
  render();
}
function setMission(n) {
  state.mission = state.mission === n ? 0 : n; state.allAcc = false;
  if (state.mission) { state.sel = null; const first = D.MISSIONS[state.mission].units; state.x = clampX(unitById[first[0]].at * PITCH - 40); if (state.mission === 1) state.x = centreOn(0, 8); if (state.mission === 2) state.x = centreOn(0, 8); if (state.mission === 3) state.x = centreOn(10, 20); }
  render();
}
function toast(t) { const el = $("#toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => (el.style.display = "none"), 2600); }

// taps (a swipe is an optional extra; every pan has a tap equivalent)
let drag = null;
const room = $("#room");
room.addEventListener("pointerdown", (e) => { drag = { x0: e.clientX, sx: state.x, moved: false, k: scale }; });
addEventListener("pointermove", (e) => {
  if (!drag) return; const dx = (e.clientX - drag.x0) / drag.k;
  if (Math.abs(dx) > 24) { drag.moved = true; $("#strip").classList.add("drag"); state.x = clampX(drag.sx - dx); $("#strip").style.transform = `translateX(${-state.x}px)`; }
});
addEventListener("pointerup", () => { if (!drag) return; const moved = drag.moved; drag = null; $("#strip").classList.remove("drag"); if (moved) { setTimeout(() => (swallow = false), 0); render(); } });
let swallow = false;
room.addEventListener("click", (e) => {
  if (drag && drag.moved) return;
  const t = e.target.closest("[data-id],[data-card],[data-tray]"); if (!t) return;
  if (t.dataset.card === "pft") return select("pft");
  if (t.dataset.tray) return select(t.dataset.tray);
  const u = unitById[t.dataset.id];
  select(u.kind, u.kind === "acc" || u.kind === "ft" ? u.id : null);
}, true);
$("#al").onclick = () => { state.x = clampX(state.x - STEP); render(); };
$("#ar").onclick = () => { state.x = clampX(state.x + STEP); render(); };
$("#minimap").addEventListener("click", (e) => {
  const r = $("#minimap").getBoundingClientRect(); const px = ((e.clientX - r.left) / scale - 20) / 33;
  state.x = clampX((px) * PITCH - VW / 2); render();
});
addEventListener("keydown", (e) => { if (e.key === "ArrowLeft") $("#al").click(); if (e.key === "ArrowRight") $("#ar").click(); if (e.key === "Escape") select(null); });

// glossary overlay (S15)
function glossary() {
  const g = $("#gloss"); g.classList.toggle("on", !!state.gloss); if (!state.gloss) return;
  const per = 8, pages = Math.ceil(D.GLOSSARY.length / per), p = state.glossPage;
  g.innerHTML = `<div class="gh"><h2>Glossary: words you met</h2><button class="btn-o" id="gp" style="width:300px">${p + 1 < pages ? "More words ›" : "‹ First words"}</button><button class="btn-o" id="gx" style="width:200px">Close</button></div><div class="tiles">${D.GLOSSARY.slice(p * per, p * per + per).map((t) => `<div class="tile ${t[1].startsWith("HOLD") ? "hold" : ""}"><b>${t[0]}</b><span>${t[1].replace(/ ?\[FC\]/g, "<sup style='font-size:13px;color:#8a4b00'> FC</sup>")}</span>${t[2] ? `<button class="show" data-s="${t[2]}">Show me ›</button>` : ""}</div>`).join("")}</div>`;
  $("#gx").onclick = () => { state.gloss = 0; glossary(); };
  $("#gp").onclick = () => { state.glossPage = (p + 1) % pages; glossary(); };
  $$("#gloss .show").forEach((el) => el.onclick = () => { state.gloss = 0; glossary(); select(el.dataset.s); });
}
$("#glossbtn").onclick = () => { state.gloss = 1; glossary(); };
$("#back").onclick = () => toast("Kiosk: back to the mission picker (S2)");

// fit to window
let scale = 1;
function fit() { scale = Math.min(innerWidth / 1920, innerHeight / 1080); const s = $("#stage"); s.style.transform = `translate(${(innerWidth - 1920 * scale) / 2}px, ${(innerHeight - 1080 * scale) / 2}px) scale(${scale})`; }
addEventListener("resize", fit); fit();

// initial state from the URL
if (q.get("x")) state.x = clampX(+q.get("x"));
if (q.get("mission")) setMission(+q.get("mission"));
if (q.get("unit")) { const u = q.get("unit"); const m = /^a(\d+)$/.exec(u.replace("acc", "a")); if (m) select("acc", "a" + m[1]); else select(u); }
if (q.get("glossary")) { state.gloss = 1; state.glossPage = +q.get("glossary") - 1 || 0; glossary(); }
render();
</script>
</body>
</html>
